{% load static %}
<aside class="sidebar d-flex flex-column" id="appSidebar">
  <div class="brand d-flex align-items-center gap-2">
    <img src="{% static 'img/brand/logo1.png' %}" alt="{{ COLLEGE_NAME }} crest" width="32" height="32">
    <div>
      <div class="fw-semibold text-white lh-sm">{{ COLLEGE_SHORT_NAME }}</div>
      <div class="small" style="color: rgba(255,255,255,.6);">Admissions Portal</div>
    </div>
  </div>

  <nav class="nav flex-column flex-grow-1 py-2">
    <div class="nav-section-title">Main</div>
    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'admissions:dashboard' %}">
      <i class="bi bi-speedometer2 me-2"></i> Dashboard
    </a>

    <div class="nav-section-title">Application</div>
    <a class="nav-link {% if request.resolver_match.url_name == 'section_a' %}active{% endif %}" href="{% url 'admissions:section_a' %}">
      <i class="bi bi-person-vcard me-2"></i> A: Personal Details
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'section_b' %}active{% endif %}" href="{% url 'admissions:section_b' %}">
      <i class="bi bi-mortarboard me-2"></i> B: Education History
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'section_c' %}active{% endif %}" href="{% url 'admissions:section_c' %}">
      <i class="bi bi-award me-2"></i> C: SSCE Results
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'section_d' %}active{% endif %}" href="{% url 'admissions:section_d' %}">
      <i class="bi bi-journal-bookmark me-2"></i> D: Course Selection
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'section_e' %}active{% endif %}" href="{% url 'admissions:section_e' %}">
      <i class="bi bi-file-earmark-check me-2"></i> E: Declaration & Docs
    </a>
    <a class="nav-link {% if request.resolver_match.url_name == 'summary' %}active{% endif %}" href="{% url 'admissions:summary' %}">
      <i class="bi bi-clipboard-check me-2"></i> Review & Submit
    </a>
  </nav>

  <div class="p-3">
    <form method="post" action="{% url 'admissions:logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-light w-100">
        <i class="bi bi-box-arrow-right me-2"></i> Sign Out
      </button>
    </form>
  </div>
</aside>
