{% load static %}
<nav class="navbar navbar-expand-lg navbar-admissions sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="{% url 'admissions:home' %}">
      <img src="{% static 'img/brand/logo1.png' %}" alt="{{ COLLEGE_NAME }} crest" width="40" height="40">
      <span>{{ COLLEGE_SHORT_NAME }} Admissions</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#admissionsNav"
            aria-controls="admissionsNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="admissionsNav">
      <ul class="navbar-nav mx-auto my-3 my-lg-0 gap-lg-1">
        <li class="nav-item"><a class="nav-link" href="{% url 'admissions:home' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'admissions:home' %}#programmes">Programmes</a></li>
      </ul>

      <div class="d-flex flex-column flex-lg-row gap-2">
        {% if request.user.is_authenticated %}
          <a href="{% url 'admissions:dashboard' %}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-speedometer2 me-1"></i> My Dashboard
          </a>
          <form method="post" action="{% url 'admissions:logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary btn-sm w-100">
              <i class="bi bi-box-arrow-right me-1"></i> Sign Out
            </button>
          </form>
        {% else %}
          <a href="{% url 'admissions:login' %}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i> Login
          </a>
          <a href="{% url 'admissions:signup' %}" class="btn btn-primary btn-sm">
            <i class="bi bi-pencil-square me-1"></i> Apply Now
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
