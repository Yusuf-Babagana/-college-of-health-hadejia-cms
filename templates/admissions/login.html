{% extends 'admissions/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign In · {{ COLLEGE_SHORT_NAME }} Admissions{% endblock %}

{% block content %}
<div class="auth-wrapper py-5">
  <div class="auth-card shadow-lg p-4 p-md-5">
    <div class="text-center mb-4">
      <h4 class="mt-2 mb-0">Applicant Sign In</h4>
      <p class="text-muted small mb-0">New here? <a href="{% url 'admissions:signup' %}">Create an account</a></p>
    </div>
    {% crispy form %}
  </div>
</div>
{% endblock %}
