{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ COLLEGE_SHORT_NAME }}{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'img/brand/favicon.png' %}">

  <link href="{% static 'lib/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'lib/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/theme.css' %}" rel="stylesheet">
  {% block extra_css %}{% endblock %}

  <script>
    (function () {
      const saved = localStorage.getItem('cohst-theme')
        || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', saved);
    })();
  </script>
</head>
<body>
  {% block body %}{% endblock %}

  <script src="{% static 'lib/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'lib/htmx/htmx.min.js' %}"></script>
  <script src="{% static 'lib/alpine/alpine.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
