{% extends 'auth_base.html' %}

{% block title %}Check Your Email · {{ COLLEGE_SHORT_NAME }}{% endblock %}

{% block auth_body %}
  <div class="text-center">
    <i class="bi bi-envelope-check-fill text-brand" style="font-size: 2rem;"></i>
    <p class="mt-3 text-muted">
      If an account exists for that email address, we've sent instructions for resetting your password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 mt-2">Return to Sign In</a>
  </div>
{% endblock %}
